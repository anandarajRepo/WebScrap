name: Fetch Stock News

# Runs the FavouriteStockNews agent on a schedule, commits any new data,
# and pushes real-time alerts to Telegram.

on:
  schedule:
    # Every 30 minutes, at :07 and :37 past the hour. GitHub's scheduler
    # drops runs during peak load, and the top of the hour (:00 / :30) is
    # the most contended slot, so offset, non-round minutes get skipped
    # less often. Schedules are in UTC and remain best-effort, not exact.
    - cron: "7,37 * * * *"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

# Allow the workflow to commit and push data back to the repo.
permissions:
  contents: write

concurrency:
  # Prevent overlapping runs from racing on seen_urls.json / data files.
  group: fetch-stock-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FavouriteStockNews
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: python fetch_news.py

      - name: Commit and push new data
        # Runs from the repo root so git sees the whole worktree.
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FavouriteStockNews/data FavouriteStockNews/seen_urls.json
          if git diff --cached --quiet; then
            echo "No new data to commit."
            exit 0
          fi
          git commit -m "chore(news): update stock news data [skip ci]"
          # Rebase in case another run pushed in the meantime, then push.
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); retrying..."
            sleep $((attempt * attempt))
          done
          echo "Failed to push after retries." >&2
          exit 1
